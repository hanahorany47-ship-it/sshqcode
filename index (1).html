<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لومدة أمن المعلومات — אבטחת מידע י'–י"א</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- Leaflet (خريطة 2D) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
:root{
  --bg:#0b1220; --bg2:#0f172a; --card:#131c31; --card2:#1a2540; --line:#26324d;
  --text:#e8eefc; --muted:#94a3b8; --accent:#38bdf8; --green:#22c55e; --red:#ef4444;
  --yellow:#facc15; --purple:#a78bfa; --orange:#f97316;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Cairo","Heebo",system-ui,sans-serif; font-size:18px; line-height:1.7;
  background:radial-gradient(circle at 20% 0%,#132347 0%,var(--bg) 55%) fixed; color:var(--text);
  min-height:100vh;
}
.he{font-family:"Heebo","Cairo",sans-serif;direction:rtl;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
code,.mono{font-family:"JetBrains Mono",Consolas,monospace;direction:ltr;unicode-bidi:isolate;background:#0a1020;padding:1px 6px;border-radius:6px;color:#7dd3fc;font-size:.92em}
a{color:var(--accent)}
button{font-family:inherit;font-size:17px;cursor:pointer;border:none;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--accent);color:#04121f;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
button.green{background:var(--green);color:#03150a}
button.red{background:var(--red);color:#fff}
button.small{padding:6px 12px;font-size:15px}
input,select{font-family:inherit;font-size:17px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#0a1020;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(11,18,32,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand small{font-weight:400;color:var(--muted);font-size:14px}
.topbar .sp{flex:1}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.navlink{color:var(--muted);cursor:pointer;font-size:15px;white-space:nowrap}
.navlink:hover{color:var(--text)}

main{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
h1{font-size:34px;margin:.2em 0}
h2{font-size:26px;margin:.2em 0 .5em}
h3{font-size:21px;margin:.2em 0 .4em}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:780px){.grid2{grid-template-columns:1fr}.topbar .hide-sm{display:none}}

/* ---------- login ---------- */
.login{max-width:560px;margin:6vh auto;text-align:center}
.login .shield{font-size:90px;animation:float 3s ease-in-out infinite}
.login input{width:100%;font-size:22px;text-align:center;margin:14px 0}
.login .known{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
@keyframes float{50%{transform:translateY(-10px)}}

/* ---------- home map ---------- */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.hero .big{font-size:64px}
.progressbar{height:14px;background:#0a1020;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .8s}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.stagecard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;transition:transform .15s,border-color .15s;overflow:hidden}
.stagecard:hover{transform:translateY(-4px)}
.stagecard .num{position:absolute;top:12px;left:16px;font-size:44px;font-weight:900;opacity:.12}
.stagecard .ic{font-size:46px}
.stagecard.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.stagecard.locked:hover{transform:none}
.stagecard.done{border-color:var(--green)}
.stagecard .status{margin-top:10px;font-size:15px}
.stagecard .mini{height:8px;background:#0a1020;border-radius:99px;overflow:hidden;margin-top:8px}
.stagecard .mini>div{height:100%;background:var(--accent)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;display:flex;gap:6px;align-items:center}
.badge.off{opacity:.35;filter:grayscale(1)}

/* ---------- stage view ---------- */
.stagehead{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.stagehead .ic{font-size:56px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.tab{background:var(--card);border:2px solid var(--line);color:var(--text);border-radius:14px;padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.tab.on{border-color:var(--accent);background:var(--card2)}
.tab .ok{color:var(--green)}
.tab.locked{opacity:.45}

/* ---------- presentation ---------- */
.deck{position:relative;background:linear-gradient(160deg,#16213b,#0e1629);border:1px solid var(--line);border-radius:22px;min-height:440px;padding:30px 34px 80px;overflow:hidden}
.slide{animation:slideIn .6s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.slide .sicon{font-size:72px;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.slide h2{font-size:30px;animation:fadeUp .6s .15s both}
.slide .stext{font-size:21px;animation:fadeUp .6s .3s both;max-width:760px}
.slide .term{display:inline-flex;gap:14px;align-items:center;margin-top:18px;background:#0a1020;border:1px dashed var(--accent);border-radius:14px;padding:8px 16px;animation:fadeUp .6s .45s both;flex-wrap:wrap}
.slide .term .he{font-size:24px;font-weight:800;color:var(--yellow)}
.slide .term .en{direction:ltr;color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.deck .controls{position:absolute;bottom:16px;right:20px;left:20px;display:flex;align-items:center;gap:10px}
.deck .dots{flex:1;display:flex;gap:6px;justify-content:center}
.deck .dot{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}
.deck .dot.on{background:var(--accent);width:30px;border-radius:8px}
.deck .timer{position:absolute;top:0;right:0;height:4px;background:var(--accent)}
.slidebody{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.slidebody .txt{flex:1 1 380px}
.slidebody .vis{flex:0 1 330px;min-height:200px;display:flex;align-items:center;justify-content:center}

/* ---- slide visuals ---- */
.v-cia{position:relative;width:300px;height:260px}
.v-cia svg{width:100%;height:100%}
.v-cia .lbl{position:absolute;font-weight:800;font-size:16px;padding:4px 10px;border-radius:10px;background:#0a1020;border:1px solid var(--line);animation:pop .6s both}
.v-hash{display:flex;align-items:center;gap:10px;flex-direction:column}
.v-hash .in{background:#0a1020;padding:8px 14px;border-radius:10px;animation:fadeUp .5s both}
.v-hash .mach{font-size:56px;animation:shake .4s 3 .4s}
.v-hash .out{font-family:monospace;color:var(--green);direction:ltr;font-size:13px;background:#0a1020;padding:8px;border-radius:10px;animation:fadeUp .5s 1.4s both;word-break:break-all;max-width:300px}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.v-caesar{display:grid;grid-template-columns:repeat(7,34px);gap:6px;direction:ltr}
.v-caesar div{height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800;font-family:monospace}
.v-caesar .p{background:#1e293b}
.v-caesar .c{background:#4c1d95;animation:pop .4s both}
.v-ip{display:flex;gap:6px;direction:ltr;font-family:monospace;font-size:26px;font-weight:800}
.v-ip span{background:#0a1020;border:2px solid var(--accent);border-radius:10px;padding:4px 10px;animation:pop .5s both}
.v-ip i{align-self:flex-end;font-style:normal;color:var(--muted)}
.v-packet{width:300px;border:2px solid var(--green);border-radius:14px;overflow:hidden;font-family:monospace;direction:ltr;font-size:14px}
.v-packet div{padding:8px 12px;border-bottom:1px solid var(--line);animation:fadeUp .4s both}
.v-packet .h{background:#052e16}
.v-acl{width:310px;font-family:monospace;direction:ltr;font-size:13px}
.v-acl div{padding:7px 10px;margin:5px 0;border-radius:8px;background:#0a1020;border-right:5px solid var(--green);animation:fadeUp .4s both}
.v-acl .d{border-right-color:var(--red)}
.v-acl .imp{opacity:.6;border-style:dashed}
.v-osi{width:290px}
.v-osi div{padding:9px 12px;margin:4px 0;border-radius:10px;font-weight:700;animation:slideIn .5s both}
.v-flow{display:flex;align-items:center;gap:8px;font-size:44px;flex-wrap:wrap;justify-content:center}
.v-flow .arrow{font-size:28px;color:var(--muted);animation:pulse 1.2s infinite}
.v-flow .lab{font-size:14px;display:block;text-align:center;color:var(--muted)}
@keyframes pulse{50%{opacity:.25}}
.v-term{background:#000;color:#4ade80;font-family:monospace;direction:ltr;text-align:left;padding:14px;border-radius:10px;font-size:14px;width:310px}
.v-term div{white-space:pre;overflow:hidden;animation:typing 1s steps(30) both}
@keyframes typing{from{width:0}to{width:100%}}

/* ---------- quiz ---------- */
.quiz .qtitle{font-size:23px;font-weight:800;margin-bottom:14px}
.options{display:grid;gap:10px}
.opt{background:var(--card2);border:2px solid var(--line);color:var(--text);text-align:right;padding:14px 18px;font-weight:600;font-size:19px}
.opt.right{border-color:var(--green);background:#052e16}
.opt.wrong{border-color:var(--red);background:#3b0a0a}
.feedback{margin-top:14px;padding:14px;border-radius:12px;animation:fadeUp .3s both}
.feedback.good{background:#052e16;border:1px solid var(--green)}
.feedback.bad{background:#3b0a0a;border:1px solid var(--red)}
.qprog{display:flex;gap:6px;margin-bottom:14px}
.qprog span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.qprog span.r{background:var(--green)}.qprog span.w{background:var(--red)}.qprog span.c{background:var(--accent)}
.result{text-align:center;padding:30px}
.result .score{font-size:70px;font-weight:900}

/* ---------- activities ---------- */
.actlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:18px}
.actbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--text);text-align:right}
.actbtn.on{border-color:var(--accent)}
.actbtn .t{font-weight:800;font-size:18px}
.actbtn .ic{font-size:34px}
.actbtn .done{color:var(--green);font-size:14px}

.scenario{font-size:22px;background:var(--card2);border-radius:16px;padding:22px;margin:12px 0;border-right:6px solid var(--accent);animation:fadeUp .4s both}
.cia-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cia-btns button{padding:16px 8px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cia-btns button .he{font-size:22px}

/* phone & mail mockups */
.msgwrap{display:flex;justify-content:center;margin:12px 0}
.phone{width:340px;background:#000;border-radius:34px;padding:14px;border:3px solid #333}
.phone .screen{background:#111827;border-radius:24px;padding:16px;min-height:220px}
.phone .from{font-weight:800;margin-bottom:8px;color:#cbd5e1}
.bubble{background:#1f2937;padding:12px 14px;border-radius:16px 16px 16px 4px;font-size:17px}
.chat .bubble{background:#064e3b}
.mail{width:100%;max-width:560px;background:#f8fafc;color:#0f172a;border-radius:14px;overflow:hidden}
.mail .mh{background:#e2e8f0;padding:10px 16px;font-size:15px}
.mail .mh b{direction:ltr;unicode-bidi:isolate}
.mail .mb{padding:16px}
.clues{margin:6px 0 0;padding-right:20px}

/* strength */
.meter{height:18px;border-radius:99px;background:#0a1020;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.meter>div{height:100%;transition:width .3s,background .3s}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:16px}
.checks .y{color:var(--green)}.checks .n{color:var(--muted)}

/* caesar wheel */
.wheel{position:relative;width:300px;height:300px;margin:auto}
.wheel .ring{position:absolute;inset:0;border-radius:50%;transition:transform .5s}
.wheel .ring span{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;text-align:center;font-weight:800;font-family:monospace;font-size:15px}
.wheel .outer{border:2px solid var(--line);background:#0e1629}
.wheel .inner{inset:42px;border:2px solid var(--purple);background:#1e1538}
.wheel .center{position:absolute;inset:110px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--purple)}
.wheel .pointer{position:absolute;left:50%;top:-6px;margin-left:-8px;width:0;height:0;border:8px solid transparent;border-top:14px solid var(--yellow)}
.cipherout{font-family:monospace;font-size:26px;direction:ltr;letter-spacing:3px;background:#0a1020;padding:10px 16px;border-radius:12px;min-height:56px;color:var(--purple);word-break:break-all}

/* pwned lab */
.steps{display:grid;gap:12px}
.step{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;opacity:.35;transition:opacity .4s}
.step.on{opacity:1;border-color:var(--accent)}
.step .n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#000;font-weight:900;align-items:center;justify-content:center;margin-left:8px}
.hashview{font-family:monospace;direction:ltr;font-size:17px;word-break:break-all;background:#0a1020;padding:10px;border-radius:10px;margin-top:8px}
.hashview .pre{color:var(--yellow);background:#422006;border-radius:4px;padding:0 2px}
.hashview .suf{color:#7dd3fc}
.hashlist{font-family:monospace;direction:ltr;font-size:12px;max-height:170px;overflow:auto;background:#000;color:#9ca3af;padding:8px;border-radius:10px;margin-top:8px}
.hashlist .hit{color:#000;background:var(--red);font-weight:900}
.netlog{font-family:monospace;direction:ltr;font-size:13px;color:#86efac;background:#000;padding:8px 10px;border-radius:8px;margin-top:6px;word-break:break-all}

/* ip / globe */
#globe,#map2d{width:100%;height:420px;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.infogrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:16px}
.infogrid b{color:var(--muted);font-weight:600}
.octets{display:flex;gap:6px;direction:ltr;flex-wrap:wrap;margin-top:6px}
.octets div{background:#0a1020;border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;font-family:monospace}
.octets div small{display:block;color:var(--muted);font-size:11px}
.tagp{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:700}

/* acl */
#aclCanvas{width:100%;background:#0e1629;border:2px solid var(--line);border-radius:16px}
.rules{display:grid;gap:8px}
.rule{display:flex;gap:6px;align-items:center;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:8px;flex-wrap:wrap;transition:border-color .2s,background .2s}
.rule select{font-size:15px;padding:6px 8px}
.rule .num{font-weight:900;width:24px;text-align:center;color:var(--muted)}
.rule.check{border-color:var(--yellow);background:#422006}
.rule.match-p{border-color:var(--green);background:#052e16}
.rule.match-d{border-color:var(--red);background:#3b0a0a}
.rule.implicit{opacity:.75;border-style:dashed}
.rule .cli{flex-basis:100%;font-family:monospace;direction:ltr;font-size:12.5px;color:var(--muted);text-align:left}
.mission{background:#0a1020;border:2px solid var(--purple);border-radius:14px;padding:14px;margin-bottom:12px}
.mission.ok{border-color:var(--green)}
.testres{font-size:15px;margin-top:8px}
.testres div{padding:3px 0}

/* dns dissector */
.layers{display:grid;gap:8px;margin-top:12px}
.layer{border-radius:12px;overflow:hidden;border:1px solid var(--line);animation:slideIn .5s both}
.layer .lh{padding:10px 14px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between}
.layer .lb{padding:10px 14px;background:#0a1020;font-family:monospace;direction:ltr;font-size:14px;text-align:left}
.layer table{width:100%;border-collapse:collapse}
.layer td,.layer th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
.travel{display:flex;align-items:center;justify-content:space-between;background:#0a1020;border-radius:14px;padding:14px 20px;position:relative;margin-top:10px;font-size:34px;direction:ltr}
.travel .lab{font-size:13px;display:block;text-align:center;color:var(--muted)}
.travel .pk{position:absolute;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;background:var(--yellow);box-shadow:0 0 14px var(--yellow);left:70px;transition:left 1.2s ease-in-out}

/* switch escape room */
.switchbox{background:linear-gradient(#334155,#1e293b);border-radius:14px;padding:16px;border:2px solid #475569;direction:ltr}
.switchbox .lbl{color:#cbd5e1;font-family:monospace;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.ports{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.port{background:#0b1220;border-radius:6px;height:56px;position:relative;border:2px solid #475569;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#94a3b8;font-family:monospace;font-size:12px;padding-bottom:2px}
.port .led{position:absolute;top:5px;width:10px;height:10px;border-radius:50%;background:#334155}
.port.up .led{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1s infinite}
.port.down .led{background:#f59e0b}
.port.err .led{background:var(--red);box-shadow:0 0 10px var(--red)}
.port .dev{position:absolute;top:-30px;font-size:22px}
.port.focus{border-color:var(--yellow)}
.terminal{background:#000;color:#4ade80;font-family:"JetBrains Mono",Consolas,monospace;direction:ltr;text-align:left;border-radius:12px;padding:12px;height:300px;overflow:auto;font-size:14.5px;border:1px solid #14532d}
.terminal .l{white-space:pre-wrap}
.terminal .err{color:#f87171}.terminal .sys{color:#fbbf24}.terminal .cmd{color:#e5e7eb}
.terminal .inrow{display:flex;gap:6px}
.terminal input{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:14.5px;padding:0;direction:ltr}
.escape-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.clock{font-family:monospace;font-size:22px;background:#000;color:var(--red);padding:2px 12px;border-radius:8px;direction:ltr}

/* final */
.dropzone{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:grid;gap:6px}
.dropzone.over{border-color:var(--accent);background:#0c2033}
.dcard{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-family:monospace;direction:ltr;text-align:left;cursor:grab;font-size:15px;user-select:none}
.dcard.sel{border-color:var(--yellow)}
.matchgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.mterm,.mdef{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.mterm.sel{border-color:var(--yellow)}
.mterm.ok,.mdef.ok{border-color:var(--green);background:#052e16;cursor:default}
.mdef.bad{animation:shake .3s}
.cert{background:linear-gradient(135deg,#fef9c3,#fde68a);color:#422006;border-radius:18px;padding:40px;text-align:center;border:10px double #b45309;max-width:760px;margin:auto}
.cert h1{color:#78350f;font-size:40px}
.cert .nm{font-size:42px;font-weight:900;border-bottom:3px solid #b45309;display:inline-block;padding:0 30px;margin:10px 0}

/* misc */

}

function me() { return DB.current ? DB.students[DB.current] : null; }
function stageState(id) {
  const s = me(); s.stages[id] = s.stages[id] || { slides: false, acts: {}, quiz: null, done: false };
  return s.stages[id];
}
function addPoints(n, why) { const s = me(); s.points += n; save(); toast(`+${n} ⭐ ${why || ""}`); renderTop(); }

function allStagesDone() { return STAGES.every(st => stageState(st.id).done); }

  const ss = stageState(st.id); const total = 2 + st.activities.length;

  return Math.round(d / total * 100);
}
function checkStageDone(st) {
  const ss = stageState(st.id);
  if (ss.done) return;
  if (ss.slides && st.activities.every(a => ss.acts[a.id]) && ss.quiz != null && ss.quiz >= PASS_STAGE) {
    ss.done = true; save(); confetti();
    addPoints(50, L("أنهيت المرحلة!", "סיימת את השלב!"));
    const last = st.id >= STAGES.length;
    setTimeout(() => modal(`<div style="text-align:center"><div style="font-size:80px">${st.badge.icon}</div><h2>${L("مبروك يا", "כל הכבוד,")} ${esc(DB.current)}!</h2>
      <p>${L(`أنهيت المرحلة ${st.id} وحصلت على شارة`, `סיימת את שלב ${st.id} וקיבלת את התג`)} <b>«${T(st.badge.name)}»</b></p>
      <button onclick="closeModal();go('${last ? "final" : "stage-" + (st.id + 1)}')">${last ? L("إلى الاختبار النهائي 🏆", "למבחן המסכם 🏆") : L("إلى المرحلة التالية ←", "לשלב הבא ←")}</button></div>`), 600);
  }
}
function markAct(st, actId) {
  const ss = stageState(st.id);
  if (!ss.acts[actId]) { ss.acts[actId] = true; save(); addPoints(20, L("نشاط مكتمل", "פעילות הושלמה")); checkStageDone(st); renderTabsOnly && renderTabsOnly(); }
}

// ---------------- أدوات واجهة ----------------
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function modal(html) {
  closeModal();
  const m = document.createElement("div"); m.id = "modal";
  m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px";
  m.innerHTML = `<div class="card" style="max-width:600px;width:100%;max-height:90vh;overflow:auto;animation:popIn .4s both">${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }
function confetti() {
  const c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
  c.width = innerWidth; c.height = innerHeight; const x = c.getContext("2d");
  const cols = ["#38bdf8", "#22c55e", "#facc15", "#a78bfa", "#f97316", "#ef4444"];
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height / 2, r: 4 + Math.random() * 6, vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, c: cols[Math.random() * 6 | 0], a: Math.random() * 6 }));
  let f = 0; (function loop() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); x.restore(); }); if (++f < 200) requestAnimationFrame(loop); else c.remove(); })();
}
function speak(text, lang) {
  lang = lang || DB.lang;
  if (!("speechSynthesis" in window)) return toast(L("المتصفح لا يدعم القراءة الصوتية", "הדפדפן לא תומך בהקראה"));
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, " "));
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith(lang === "he" ? "he" : "ar") || (lang === "he" && v.lang.startsWith("iw")));
  if (v) u.voice = v; u.lang = lang === "he" ? "he-IL" : "ar-SA"; u.rate = .9;
  speechSynthesis.speak(u);
}
const langSwitch = () => `<div class="langsw"><button class="${DB.lang === "ar" ? "on" : ""}" onclick="setLang('ar')">العربية</button><button class="${DB.lang === "he" ? "on" : ""}" onclick="setLang('he')">עברית</button></div>`;

// ---------------- التوجيه ----------------
let currentTab = {};
let renderTabsOnly = null;
let cleanupActivity = null;
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
window.addEventListener("hashchange", route);
function route() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (cleanupActivity) { try { cleanupActivity(); } catch (e) {} cleanupActivity = null; }
  renderTop();
  const h = location.hash.replace("#", "") || "home";
  const main = $("#main"); scrollTo(0, 0);
  if (!me()) return renderLogin(main);
  if (h.startsWith("stage-")) { const id = +h.split("-")[1]; const st = STAGES.find(s => s.id === id); if (st && isUnlocked(id)) return renderStage(main, st); }
  if (h === "final") return allStagesDone() ? renderFinal(main) : (toast(L("🔒 أنهِ كل المراحل أولاً", "🔒 קודם מסיימים את כל השלבים")), renderHome(main));
  if (h === "glossary") return renderGlossary(main);
  if (h === "teacher") return renderTeacher(main);
  renderHome(main);
}

function renderStage(main, st) {
  const tab = currentTab[st.id] || "slides";
  main.innerHTML = `
    <div class="stagehead">
      <div class="ic">${st.icon}</div>
      <div style="flex:1;min-width:230px"><div class="muted">${L("المرحلة", "שלב")} ${st.id} ${L("من", "מתוך")} ${STAGES.length}</div>
        <h1 style="margin:0">${T(st.title)}</h1></div>
      <button class="ghost" onclick="go('home')">${L("→ الخريطة", "→ למפה")}</button>
    </div>
    <div class="card" style="margin-bottom:14px">🎯 <b>${L("هدف المرحلة:", "מטרת השלב:")}</b> ${T(st.goal)}</div>
    <div class="tabs" id="tabs"></div>
    <div id="tabbody"></div>`;
  renderTabsOnly = () => {
    const ss = stageState(st.id); const t = currentTab[st.id] || "slides";
    const actsDone = st.activities.every(a => ss.acts[a.id]);
    if (!$("#tabs")) return;
    $("#tabs").innerHTML = `
      <button class="tab ${t === "slides" ? "on" : ""}" data-t="slides">🎬 1. ${L("العرض المتحرك", "מצגת מונפשת")} ${ss.slides ? '<span class="ok">✔</span>' : ""}</button>
      <button class="tab ${t === "acts" ? "on" : ""}" data-t="acts">🎮 2. ${L("المحاكاة والأنشطة", "סימולציות ופעילויות")} (${st.activities.filter(a => ss.acts[a.id]).length}/${st.activities.length}) ${actsDone ? '<span class="ok">✔</span>' : ""}</button>
      <button class="tab ${t === "quiz" ? "on" : ""}" data-t="quiz">📝 3. ${L("اختبار قصير", "בוחן קצר")} ${ss.quiz != null ? `(${ss.quiz})` : ""} ${ss.quiz >= PASS_STAGE ? '<span class="ok">✔</span>' : ""}</button>
      ${ss.done ? `<span class="pill" style="border-color:var(--green)">✅ ${L("المرحلة مكتملة", "השלב הושלם")} ${st.badge.icon}</span>` : ""}`;
    $$("#tabs [data-t]").forEach(b => b.onclick = () => { currentTab[st.id] = b.dataset.t; route(); });
  };
  renderTabsOnly();
  const body = $("#tabbody");
  if (tab === "slides") renderDeck(body, st);
  else if (tab === "acts") renderActivities(body, st);
  else renderQuiz(body, st.quiz, score => {
    const ss = stageState(st.id); const first = ss.quiz == null || ss.quiz < PASS_STAGE;
    ss.quiz = Math.max(ss.quiz || 0, score); save();
    if (score >= PASS_STAGE && first) addPoints(Math.round(score / 10) * 3, L("اجتزت الاختبار", "עברת את הבוחן"));
    renderTabsOnly(); checkStageDone(st);
  }, { pass: PASS_STAGE, stage: st });
}

      ${s.visual ? `<div class="vis">${visualHTML(s.visual)}</div>` : ""}</div></div>`;
    $("#dots").innerHTML = st.slides.map((_, k) => `<span class="dot ${k === i ? "on" : ""}" data-k="${k}"></span>`).join("");

    t0 = performance.now();
    if (playing) speak(T(s.title) + ". " + T(s.text));
  };
  const finish = () => {
    stop(); const ss = stageState(st.id);
    if (!ss.slides) { ss.slides = true; save(); addPoints(10, L("شاهدت العرض", "צפית במצגת")); renderTabsOnly(); checkStageDone(st); }
    $("#slidebox").innerHTML = `<div class="slide" style="text-align:center;padding-top:40px"><div class="sicon">🎉</div><h2>${L("أحسنت! أنهيت العرض", "כל הכבוד! סיימת את המצגת")}</h2>
      <p class="stext" style="margin:auto">${L("الآن وقت المحاكاة والتجربة.", "עכשיו הזמן לסימולציות ולניסויים.")}</p><br><button onclick="currentTab[${st.id}]='acts';route()">🎮 ${L("إلى المحاكاة", "לסימולציות")}</button>
      <button class="ghost" id="again">↻ ${L("شاهد مرة أخرى", "צפה שוב")}</button></div>`;
    $("#again").onclick = () => { i = 0; show(); };
  };
  const next = () => { if (i < st.slides.length - 1) { i++; show(); } else finish(); };
  const tick = () => { if (!playing) return; const p = (performance.now() - t0) / DUR; const tm = $("#dtimer"); if (!tm) return stop(); tm.style.width = Math.min(100, p * 100) + "%"; if (p >= 1) next(); if (playing) timer = requestAnimationFrame(tick); };
  const stop = () => { playing = false; cancelAnimationFrame(timer); if (window.speechSynthesis) speechSynthesis.cancel(); $("#play") && ($("#play").textContent = "▶ " + L("تشغيل كفيديو", "הפעל כסרטון")); $("#dtimer") && ($("#dtimer").style.width = 0); };
  $("#prev").onclick = () => { if (i > 0) { i--; show(); } };
  $("#next").onclick = next;
  $("#play").onclick = () => { if (playing) return stop(); playing = true; $("#play").textContent = "⏸ " + L("إيقاف", "עצור"); show(); tick(); };
  $("#say").onclick = () => { const s = st.slides[i]; speak(T(s.title) + ". " + T(s.text)); };
  cleanupActivity = stop;
  show();
}

// ---------------- الاختبار القصير ----------------
function renderQuiz(body, questions, onDone, opts = {}) {
  const qs = shuffle(questions).map(q => { const order = shuffle(q.options.map((o, k) => k)); return { ...q, options: order.map(k => q.options[k]), answer: order.indexOf(q.answer) }; });
  let i = 0, right = 0; const marks = [];
  const draw = () => {
    if (i >= qs.length) {
      const score = Math.round(right / qs.length * 100); onDone && onDone(score, right, qs.length);
      if (opts.next) return opts.next(right, qs.length);
      const ok = score >= (opts.pass || PASS_STAGE);
      body.innerHTML = `<div class="card result"><div style="font-size:70px">${ok ? "🎉" : "💪"}</div><div class="score" style="color:${ok ? "var(--green)" : "var(--orange)"}">${score}</div>
        <p style="font-size:20px">${right} / ${qs.length}. ${ok ? L("ممتاز! نجحت.", "מצוין! עברת.") : L(`تحتاج ${opts.pass || PASS_STAGE} على الأقل — راجع العرض وحاول مرة أخرى، أنت قادر!`, `צריך לפחות ${opts.pass || PASS_STAGE} — חזרו על המצגת ונסו שוב, אתם יכולים!`)}</p>
        <button id="retry">↻ ${L("اختبار من جديد", "בוחן חדש")}</button> ${!ok && opts.stage ? `<button class="ghost" onclick="currentTab[${opts.stage.id}]='slides';route()">🎬 ${L("راجع العرض", "חזרה למצגת")}</button>` : ""}</div>`;
      $("#retry").onclick = () => renderQuiz(body, questions, onDone, opts);
      return;
    }
    const q = qs[i];
    body.innerHTML = `<div class="card quiz"><div class="qprog">${qs.map((_, k) => `<span class="${marks[k] || (k === i ? "c" : "")}"></span>`).join("")}</div>
      <div class="muted">${L("سؤال", "שאלה")} ${i + 1} / ${qs.length}</div><div class="qtitle">${T(q.q)}</div>
      <div class="options">${q.options.map((o, k) => `<button class="opt" data-k="${k}">${T(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
    $$(".opt", body).forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.answer;
      $$(".opt", body).forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong"); else right++;
      marks[i] = ok ? "r" : "w";
      $("#fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}">${ok ? L("✅ صحيح!", "✅ נכון!") : L("❌ ليس تماماً.", "❌ לא בדיוק.")} ${T(q.explain) || ""}<br><br><button id="nq">${i === qs.length - 1 ? L("النتيجة 🏁", "לתוצאה 🏁") : L("السؤال التالي ←", "השאלה הבאה ←")}</button></div>`;
      $("#nq").onclick = () => { i++; draw(); };
    });
  };
  draw();
}

ACT.ciasim = (box, st, act) => {

      <div class="tbar"><div id="tbar"></div></div>

    </div><div>
      <div class="tools" id="tools">${Object.entries(TOOLS).map(([k, t]) => `<button class="ghost" data-tool="${k}"><span style="font-size:26px">${t.i}</span><span>${T(t.n)}</span></button>`).join("")}</div>
      <div class="hint small">💡 ${L("ماذا يريد المهاجم؟ أن <b>يرى</b> (סודיות)، أن <b>يغيّر</b> (שלמות)، أم أن <b>يوقف</b> الخدمة (זמינות)؟", "מה התוקף רוצה? <b>לראות</b> (סודיות), <b>לשנות</b> (שלמות), או <b>להשבית</b> (זמינות)?")}</div>

  const stopT = () => { clearInterval(timer); timer = null; };
  const next = () => {

    $("#nxt").onclick = () => { i++; next(); };

      <div class="mbody ${m.kind !== "email" ? "bubbly" : ""}">${T(m.body)}${linkHTML(m)}</div>
      <div id="mres">${m.state ? verdict(m) : `<div class="row" style="margin-top:14px"><button class="red" id="rep">🚩 ${L("بلّغ: احتيال", "דווח: הונאה")}</button><button class="green" id="ok">✅ ${L("رسالة آمنة", "הודעה בטוחה")}</button></div>`}</div>`;
    const ln = $("#mlink");
    if (ln) {
      const show = () => { $("#sbar").innerHTML = `🔗 ${L("الرابط الحقيقي:", "הכתובת האמיתית:")} <b class="ltr" style="color:${m.fake ? "var(--red)" : "var(--green)"}">${ln.dataset.real}</b>`; };
      ln.onmouseenter = show; ln.onfocus = show; $("#peek").onclick = show;
      ln.onmouseleave = () => { };

    }
    $("#rep") && ($("#rep").onclick = () => decide(m, true));
    $("#ok") && ($("#ok").onclick = () => decide(m, false));
  };
  const verdict = m => {

      ${L("هذه الرسالة", "ההודעה הזו")} ${m.fake ? L("احتيال 🎣", "הונאה 🎣") : L("حقيقية ✅", "אמיתית ✅")}:<ul class="clues">${m.clues.map(c => `<li>${T(c)}</li>`).join("")}</ul></div>`;
  };
  const decide = (m, reported) => { m.state = reported ? "rep" : "safe"; if (reported === m.fake) toast(L("✅ أحسنت!", "✅ כל הכבוד!")); open(m.k); };
  const clickLink = m => {
    if (!m.fake) { toast(L("✅ رابط آمن — نفس العنوان المكتوب", "✅ קישור בטוח — אותה כתובת שכתובה")); return; }
    $("#mview").innerHTML = `<div class="fakesite"><div class="fakeurl">⚠️ <span class="ltr">${m.link.real}</span></div>
      <div style="padding:20px;text-align:center"><div style="font-size:40px">🔐</div><h3>${L("سجّل الدخول للمتابعة", "התחברו כדי להמשיך")}</h3>
      <input placeholder="${L("اسم المستخدم", "שם משתמש")}" style="width:100%;margin:6px 0"><input type="password" placeholder="${L("كلمة السر", "סיסמה")}" style="width:100%;margin:6px 0">
      ${/card|prize|pay/.test(m.link.real) ? `<input placeholder="💳 0000 0000 0000 0000" style="width:100%;margin:6px 0;direction:ltr">` : ""}
      <button id="fsub" style="width:100%">${L("دخول", "כניסה")}</button><p class="muted" style="font-size:13px">🧪 ${L("هذه صفحة تدريب مزيفة داخل المحاكاة", "זה דף אימון מזויף בתוך הסימולציה")}</p></div></div>`;

      <p>${fell ? L(`وقعت في الفخ ${fell} مرة — تذكّر أن تفحص الرابط الحقيقي قبل الضغط!`, `נפלתם בפח ${fell} פעמים — זכרו לבדוק את הכתובת האמיתית לפני לחיצה!`) : L("لم تقع في أي فخ! 🦅", "לא נפלתם באף פח! 🦅")}</p><button id="again">↻ ${L("مرة أخرى", "שוב")}</button></div>`);

// ================== المرحلة 2: محاكاة انتشار البرامج الضارة ==================
ACT.malsim = (box, st, act) => {
  const N = 16; let pcs, running = false, timer = null, mission = 0, backupAtRun = false, lastType = null;
  const DEF = { upd: false, av: false, fw: false, bk: false };
  const MISS = [
    B("مهمة 1: أطلق <b>الدودة</b> بدون أي حماية — وشاهد كم حاسوباً تصيب.", "משימה 1: שחררו <b>תולעת</b> בלי שום הגנה — וראו כמה מחשבים נדבקים."),
    B("مهمة 2: شغّل أدوات حماية وأطلق <b>الدودة</b> مرة أخرى — اجعل الإصابات <b>4 أو أقل</b>.", "משימה 2: הפעילו כלי הגנה ושחררו שוב <b>תולעת</b> — הגיעו ל-<b>4 הדבקות או פחות</b>."),
    B("مهمة 3: <b>برنامج فدية</b> يهاجم! بعد التشفير — استرجع كل الملفات بدون أن تدفع.", "משימה 3: <b>כופרה</b> תוקפת! אחרי ההצפנה — שחזרו את כל הקבצים בלי לשלם.")
  ];
  box.innerHTML = `<div class="card"><div class="mission" id="mmis"></div>
    <div class="grid2"><div>
      <h3>🦠 ${L("1. اختر البرنامج الضار", "1. בחרו נוזקה")}</h3>
      <div class="row" id="mtype">${[["worm", "🪱 תולעת"], ["virus", "🦠 וירוס"], ["ransom", "💰 כופרה"]].map(([k, n]) => `<button class="ghost small" data-t="${k}">${n}</button>`).join("")}</div>
      <h3 style="margin-top:14px">🛡️ ${L("2. شغّل الحماية", "2. הפעילו הגנות")}</h3>
      <div class="defs">${[["upd", "🔄", B("تحديثات البرامج", "עדכוני תוכנה"), B("تسد الثغرات التي تستعملها الدودة", "סוגרים פרצות שהתולעת מנצלת")], ["av", "🧪", B("مضاد فيروسات", "אנטי-וירוס"), B("يكتشف وينظف الإصابات", "מזהה ומנקה הדבקות")], ["fw", "🧱", B("جدار ناري بين الغرف", "חומת אש בין הכיתות"), B("يقسم الشبكة لأجزاء", "מחלקת את הרשת לאזורים")], ["bk", "💾", B("نسخة احتياطية", "גיבוי"), B("نسخة من كل الملفات", "עותק של כל הקבצים")]].map(([k, i, n, d]) => `<label class="def"><input type="checkbox" data-d="${k}"> <span style="font-size:24px">${i}</span> <span><b>${T(n)}</b><br><small class="muted">${T(d)}</small></span></label>`).join("")}</div>
      <div class="row" style="margin-top:12px"><button id="run" style="font-size:19px">▶ ${L("3. أطلق الهجوم", "3. הפעילו מתקפה")}</button><button class="ghost" id="rst">↺ ${L("شبكة جديدة", "רשת חדשה")}</button></div>
    </div><div>
      <div class="lan" id="lan"></div>
      <div class="row" style="margin-top:8px;justify-content:space-between"><span id="mstat2" style="font-weight:800"></span><span class="muted" style="font-size:14px">💻 ${L("سليم", "תקין")} · 🦠 ${L("مصاب", "נדבק")} · 🔒 ${L("مشفّر", "מוצפן")} · 🛡️ ${L("محدّث", "מעודכן")}</span></div>
      <div id="after"></div></div></div></div>`;
  let type = "worm";
  const setType = t => { type = t; $$("#mtype button").forEach(b => b.classList.toggle("sel", b.dataset.t === t)); };
  $$("#mtype button").forEach(b => b.onclick = () => !running && setType(b.dataset.t));
  $$("[data-d]", box).forEach(c => c.onchange = () => { DEF[c.dataset.d] = c.checked; if (!running) reset(); });
  const room = k => Math.floor(k / 4);
  const reset = () => {
    const unpatched = new Set(shuffle([...Array(N).keys()].slice(1)).slice(0, 3)); unpatched.add(0);
    pcs = Array.from({ length: N }, (_, k) => ({ s: "ok", patched: DEF.upd && !unpatched.has(k) }));
    $("#after").innerHTML = ""; draw();
  };
  const draw = () => {
    $("#lan").innerHTML = [0, 1, 2, 3].map(r => `<div class="room ${DEF.fw ? "walled" : ""}"><div class="rlab">${L("غرفة", "חדר")} ${r + 1}</div>${pcs.slice(r * 4, r * 4 + 4).map((p, j) => `<div class="pc ${p.s}">${p.s === "inf" ? "🦠" : p.s === "enc" ? "🔒" : "💻"}${p.patched ? '<i>🛡️</i>' : ""}${r * 4 + j === 0 ? `<b class="p0">📧</b>` : ""}</div>`).join("")}</div>`).join("");
    const inf = pcs.filter(p => p.s !== "ok").length;
    $("#mstat2").innerHTML = `${type === "ransom" ? "🔒" : "🦠"} ${inf}/${N} ${L("أُصيب", "נפגעו")}`;
  };
  const drawMission = () => { $("#mmis").innerHTML = mission < 3 ? `🎯 ${T(MISS[mission])}` : `🏆 ${L("أنهيت كل مهمات المحاكاة!", "סיימתם את כל משימות הסימולציה!")}`; $("#mmis").classList.toggle("ok", mission >= 3); };
  const run = async () => {
    if (running) return; reset(); running = true; $("#run").disabled = true; backupAtRun = DEF.bk; lastType = type;

    toast(L("📧 أحدهم فتح مرفقاً مشبوهاً في الحاسوب الأول…", "📧 מישהו פתח קובץ מצורף חשוד במחשב הראשון…"));
    for (let tick = 0; tick < 10; tick++) {
      await sleep(650);
      const bad = pcs.map((p, k) => p.s !== "ok" ? k : -1).filter(k => k >= 0);
      for (const k of bad) {
        const tries = type === "virus" ? (Math.random() < .4 ? 1 : 0) : 2;
        for (let t = 0; t < tries; t++) {
          const cand = [...Array(N).keys()].filter(j => pcs[j].s === "ok" && (!DEF.fw || room(j) === room(k)));
          if (!cand.length) break;
          const j = cand[Math.random() * cand.length | 0];
          if (type !== "virus" && pcs[j].patched) continue;
          if (DEF.av && Math.random() < (type === "virus" ? .7 : .4)) continue;
          pcs[j].s = type === "ransom" ? "enc" : "inf";
        }
      }
      if (DEF.av && type !== "ransom") pcs.forEach((p, k) => { if (k && p.s === "inf" && Math.random() < .25) p.s = "ok"; });
      draw();
    }
    running = false; $("#run").disabled = false;
    const inf = pcs.filter(p => p.s !== "ok").length;
    let msg = "";
    if (type === "ransom") {
      $("#after").innerHTML = `<div class="feedback bad" style="margin-top:10px">💰 ${L(`${inf} حواسيب مشفّرة! رسالة المهاجم: «ادفع 5 بيتكوين لتسترجع ملفاتك».`, `${inf} מחשבים מוצפנים! הודעת התוקף: «שלמו 5 ביטקוין כדי לקבל את הקבצים».`)}
        <div class="row" style="margin-top:10px"><button class="green" id="restore">💾 ${L("استرجاع من النسخة الاحتياطية", "שחזור מגיבוי")}</button><button class="red" id="pay">💸 ${L("ادفع الفدية", "שלמו כופר")}</button></div><div id="rres"></div></div>`;
      $("#restore").onclick = () => {
        if (!backupAtRun) { $("#rres").innerHTML = `<p>😱 ${L("لا توجد نسخة احتياطية! الملفات ضاعت. شغّل 💾 قبل الهجوم وحاول مرة أخرى.", "אין גיבוי! הקבצים אבדו. הפעילו 💾 לפני המתקפה ונסו שוב.")}</p>`; return; }
        pcs.forEach(p => p.s = "ok"); draw();
        $("#after").innerHTML = `<div class="feedback good" style="margin-top:10px">✅ ${L("استرجعت كل الملفات بدون دفع! الגיבוי هو أفضل حماية من الכופרה.", "שחזרתם את כל הקבצים בלי לשלם! גיבוי הוא ההגנה הטובה ביותר מפני כופרה.")}</div>`;
        if (mission === 2) { mission = 3; drawMission(); confetti(); markAct(st, act.id); }
      };
      $("#pay").onclick = () => $("#rres").innerHTML = `<p>💸 ${L("دفعت… والمهاجم اختفى ولم يرسل المفتاح. لا تدفع أبداً — اعمل גיבוי!", "שילמתם… והתוקף נעלם בלי לשלוח מפתח. לעולם לא משלמים — עושים גיבוי!")}</p>`;
    } else {
      msg = inf > 8 ? L(`😱 ${inf} حاسوباً أُصيب! بدون حماية الدودة تنتشر بسرعة كبيرة.`, `😱 ${inf} מחשבים נדבקו! בלי הגנה תולעת מתפשטת מהר מאוד.`) : inf <= 4 ? L(`🛡️ ممتاز! فقط ${inf} إصابات. الحماية أوقفت الانتشار.`, `🛡️ מצוין! רק ${inf} הדבקות. ההגנות עצרו את ההתפשטות.`) : L(`⚠️ ${inf} إصابات. جرّب حماية إضافية.`, `⚠️ ${inf} הדבקות. נסו הגנה נוספת.`);
      if (type === "virus") msg += " " + L("(الفيروس أبطأ — ينتشر فقط عندما يفتح أحد ملفاً مصاباً.)", "(וירוס איטי יותר — מתפשט רק כשמישהו פותח קובץ נגוע.)");
      $("#after").innerHTML = `<div class="feedback ${inf <= 4 ? "good" : "bad"}" style="margin-top:10px">${msg}</div>`;
      const anyDef = DEF.upd || DEF.av || DEF.fw;
      if (mission === 0 && type === "worm" && !anyDef) { mission = 1; drawMission(); toast(L("🎯 مهمة 1 أُنجزت", "🎯 משימה 1 הושלמה")); }
      else if (mission === 1 && type === "worm" && inf <= 4) { mission = 2; drawMission(); setType("ransom"); toast(L("🎯 مهمة 2 أُنجزت", "🎯 משימה 2 הושלמה")); }
    }
  };
  $("#run").onclick = run; $("#rst").onclick = () => !running && reset();
  setType("worm"); reset(); drawMission();
  cleanupActivity = () => { running = false; };
};

// ================== المرحلة 3: قوة كلمة السر ==================
ACT.strength = (box, st, act) => {
  const common = ["123456", "password", "12345678", "qwerty", "111111", "123123", "abc123", "iloveyou", "admin", "000000", "1234567890"];
  box.innerHTML = `<div class="card"><h3>💪 ${L("مقياس قوة كلمة السر", "מד חוזק סיסמה")}</h3><p class="muted">⚠️ ${L("لا تكتب كلمة سرك الحقيقية!", "אל תכתבו את הסיסמה האמיתית שלכם!")}</p>
    <input id="pw" style="width:100%;direction:ltr;font-size:22px" placeholder="type a password..." autocomplete="off">
    <div class="meter"><div id="mbar" style="width:0"></div></div><div id="mlabel" style="font-weight:800;font-size:20px">—</div>
    <div id="crack" class="muted"></div><div class="checks" id="checks" style="margin-top:10px"></div>
    <div class="hint">🎯 ${L("المهمة: اصنع كلمة سر تصل إلى «قوية جداً». جرّب جملة مثل", "המשימה: הגיעו ל«חזקה מאוד». נסו משפט כמו")} <code>${L("Ana-Bahib-Falafel-7!", "Ani-Ohev-Falafel-7!")}</code></div></div>`;
  const inp = $("#pw");
  const upd = () => {
    const p = inp.value;
    const c = [[p.length >= 12, L("12 حرفاً أو أكثر", "12 תווים ומעלה")], [/[a-z]/.test(p), L("حرف صغير a-z", "אות קטנה a-z")], [/[A-Z]/.test(p), L("حرف كبير A-Z", "אות גדולה A-Z")], [/\d/.test(p), L("رقم 0-9", "ספרה 0-9")], [/[^A-Za-z0-9]/.test(p), L("رمز ! @ # -", "סימן ! @ # -")], [p && !common.includes(p.toLowerCase()), L("ليست من الكلمات المشهورة", "לא סיסמה נפוצה")]];
    let score = c.filter(x => x[0]).length; if (p.length < 8) score = Math.min(score, 2); if (common.includes(p.toLowerCase())) score = 0;
    const pool = (/[a-z]/.test(p) ? 26 : 0) + (/[A-Z]/.test(p) ? 26 : 0) + (/\d/.test(p) ? 10 : 0) + (/[^A-Za-z0-9]/.test(p) ? 33 : 0);
    const secs = common.includes(p.toLowerCase()) ? 0 : Math.pow(pool || 1, p.length) / 1e10;

  ];

  const prompt = () => ({ user: "Switch>", priv: "Switch#", conf: "Switch(config)#", if: "Switch(config-if)#" }[mode]);
  const drawPorts = () => {
    $("#ports").innerHTML = ports.map(p => `<div class="port ${p.shut ? "err" : p.dev ? "up" : ""} ${iface === p.n ? "focus" : ""}">${p.dev ? `<span class="dev">${p.dev}</span>` : ""}<span class="led"></span>${p.ps ? "🔒" : ""}<span>0/${p.n}</span></div>`).join("");

  };
  const check = () => {
    if (mi < M.length && M[mi].ok()) {
      M[mi].after && M[mi].after(); log("sys", `★ ${L("المهمة", "משימה")} ${mi + 1} ✔`); toast(`🔓 ${mi + 1} ✔`); mi++; drawMission(); drawPorts();
      if (mi >= M.length) { clearInterval(timerId); confetti(); markAct(st, act.id); }
    }
  };
  const ifaceRe = /^(?:f|fa|fas|fastethernet)\s*0\/([1-8])$/;
  const Wd = (u, full, min = 2) => u && u.length >= min && full.startsWith(u);
  const exec = raw => {
    const line = raw.trim().replace(/\s+/g, " "); log("cmd", prompt() + " " + raw); if (!line) return;
    const w = line.toLowerCase().split(" ");
    if (line === "?") return log("", { user: "enable", priv: "configure terminal | show port-security | show interfaces status | disable", conf: "interface fa0/N | exit | end", if: "shutdown | no shutdown | switchport mode access | switchport port-security [maximum N | violation shutdown|restrict|protect] | exit | end" }[mode]);
    if (mode === "user") { if (Wd(w[0], "enable") && w.length === 1) mode = "priv"; else log("err", "% Invalid input. → enable"); }
    else if (mode === "priv") {
      if (Wd(w[0], "configure") && Wd(w[1], "terminal", 1)) { mode = "conf"; log("", "Enter configuration commands, one per line.  End with CNTL/Z."); }
      else if (Wd(w[0], "show") && Wd(w[1], "port-security", 4)) log("", "Port    Secure  MaxAddr  Violation\n" + ports.map(p => `Fa0/${p.n}   ${p.ps ? "Yes" : "No "}     ${p.ps ? p.max : "-"}        ${p.ps ? p.viol : "-"}`).join("\n"));

      if (Wd(w[0], "interface", 3)) { const m = w.slice(1).join("").match(ifaceRe); if (m) { iface = +m[1]; mode = "if"; } else log("err", "% Invalid interface → interface fa0/3"); }

      else if (mode === "conf") log("err", "% Invalid input → interface fa0/N");

        const p = ports[iface - 1];
        if (Wd(w[0], "shutdown", 4) && w.length === 1) { p.shut = true; log("sys", `%LINK-5-CHANGED: Interface FastEthernet0/${iface}, changed state to administratively down`); }
        else if (w[0] === "no" && Wd(w[1], "shutdown", 4)) { p.shut = false; log("sys", `%LINK-3-UPDOWN: Interface FastEthernet0/${iface}, changed state to ${p.dev ? "up" : "down"}`); }
        else if (Wd(w[0], "switchport") && Wd(w[1], "mode") && Wd(w[2], "access")) p.mode = "access";
        else if (Wd(w[0], "switchport") && Wd(w[1], "port-security", 4)) {
          if (w.length === 2) { if (p.mode !== "access") log("err", `Command rejected: FastEthernet0/${iface} is a dynamic port. → switchport mode access`); else p.ps = true; }
          else if (Wd(w[2], "maximum", 3) && /^\d+$/.test(w[3] || "")) { p.max = +w[3]; p.setMax = true; }
          else if (Wd(w[2], "violation", 3) && ["shutdown", "restrict", "protect"].some(x => Wd(w[3], x, 3))) { p.viol = ["shutdown", "restrict", "protect"].find(x => Wd(w[3], x, 3)); p.setViol = true; }
          else log("err", "% Incomplete command.");
        } else log("err", "% Invalid input detected at '^' marker.");
      }
    }
    drawPorts(); check();
  };
  log("sys", "SW1 con0 is now available. ? = help");
  drawPorts(); drawMission();

  timerId = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $("#clk") && ($("#clk").textContent = String(s / 60 | 0).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0")); }, 1000);
  cleanupActivity = () => clearInterval(timerId);
};

  const cards = shuffle([{ id: "A", t: "deny tcp host 10.0.0.66 any" }, { id: "B", t: "permit tcp any any eq 80" }, { id: "C", t: "permit tcp any any" }, { id: "D", t: "deny tcp any any eq 80" }]);
  main.innerHTML = `<h2>${L("الجزء ب: مهمة ACL عملية (20)", "חלק ב: משימת ACL מעשית (20)")}</h2>
    <div class="card"><div class="scenario">🏫 ${L("خادم المدرسة داخل الشبكة. الطلبات تصل من الإنترنت عبر <code>G0/0</code>.<br>المطلوب: <b>امنع</b> الهاكر <code>10.0.0.66</code> من كل شيء، و<b>اسمح</b> للآخرين بـ HTTP (80) <b>فقط</b>.",
                                          "שרת בית הספר נמצא ברשת הפנימית. הבקשות מגיעות מהאינטרנט דרך <code>G0/0</code>.<br>נדרש: <b>לחסום</b> את ההאקר <code>10.0.0.66</code> מהכול, <b>ולאפשר</b> לכל השאר HTTP (80) <b>בלבד</b>.")}</div>
      <div style="direction:ltr;text-align:center;font-size:24px;margin:10px 0">🌍 Internet ── <b style="color:var(--yellow)">G0/0</b> [🛡️ R1] <b style="color:var(--yellow)">G0/1</b> ── 🗄️ Server</div>
      <div class="grid2"><div><h3>1️⃣ ${L("القواعد المتاحة (اسحب أو اضغط)", "חוקים זמינים (גררו או לחצו)")}</h3><div class="dropzone" id="pool"></div></div>
        <div><h3>2️⃣ ACL 101 ↓</h3><div class="dropzone" id="acl" style="min-height:140px"></div><div class="muted" style="font-size:14px">${L("اضغط على قاعدة لإرجاعها. الترتيب مهم!", "לחיצה על חוק מחזירה אותו. הסדר חשוב!")}</div></div></div>
      <h3 style="margin-top:16px">3️⃣ ${L("أين نضع الـ ACL؟", "איפה מחילים את ה-ACL?")}</h3>
      <div class="options" id="place">${shuffle([["g00in", "G0/0 in", L("الحزم الداخلة من الإنترنت", "חבילות שנכנסות מהאינטרנט")], ["g01in", "G0/1 in", L("الحزم الداخلة من الخادم", "חבילות שנכנסות מהשרת")], ["g00out", "G0/0 out", L("الحزم الخارجة للإنترنت", "חבילות שיוצאות לאינטרנט")]]).map(([v, c, t]) => `<button class="opt" data-p="${v}"><span class="mono">${c}</span> — ${t}</button>`).join("")}</div>
      <br><button id="sub1" style="font-size:19px">✔ ${L("سلّم المهمة", "הגשת המשימה")}</button></div>`;
  let placed = [], place = null;
  const draw = () => {
    $("#pool").innerHTML = cards.filter(c => !placed.includes(c.id)).map(c => `<div class="dcard" draggable="true" data-id="${c.id}">${c.t}</div>`).join("") || `<div class="muted">—</div>`;
    $("#acl").innerHTML = placed.map((id, k) => `<div class="dcard" data-id="${id}" data-in="1"><b style="color:var(--muted)">${(k + 1) * 10}</b>  access-list 101 ${cards.find(c => c.id === id).t}</div>`).join("") + `<div class="dcard" style="opacity:.5;cursor:default">(implicit) deny any any</div>`;
    $$(".dcard[data-id]").forEach(d => {
      d.onclick = () => { const id = d.dataset.id; if (d.dataset.in) placed = placed.filter(x => x !== id); else placed.push(id); draw(); };
      d.ondragstart = e => e.dataTransfer.setData("text", d.dataset.id);
    });
  };
  const z = $("#acl");
  z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = e => { e.preventDefault(); z.classList.remove("over"); const id = e.dataTransfer.getData("text"); if (id && !placed.includes(id)) { placed.push(id); draw(); } };
  $$("#place .opt").forEach(b => b.onclick = () => { place = b.dataset.p; $$("#place .opt").forEach(x => x.classList.toggle("right", x === b)); });
  draw();
  $("#sub1").onclick = () => {
    if (!placed.length || !place) return toast(L("رتّب القواعد واختر المكان أولاً", "סדרו חוקים ובחרו מיקום קודם"));
    let pts = 0;
    if (placed.join("") === "AB") pts += 14; else if (placed.includes("A") && placed.includes("B") && placed.length === 2) pts += 7; else if (placed[0] === "A") pts += 4;
    if (place === "g00in") pts += 6;
    res.t1 = pts;
    main.insertAdjacentHTML("beforeend", `<div class="card feedback ${pts >= 14 ? "good" : "bad"}" style="margin-top:14px"><b>${pts}/20</b><br>
      ${L("الحل:", "הפתרון:")} <code>10 deny tcp host 10.0.0.66 any</code> → <code>20 permit tcp any any eq 80</code>. ${L("الـ deny يجب أن يكون <b>أولاً</b>، وإلا يمرّ الهاكر عبر permit eq 80! المكان: <code>G0/0 in</code> — أقرب ما يمكن لمصدر الخطر.", "ה-deny חייב להיות <b>ראשון</b>, אחרת ההאקר יעבור דרך permit eq 80! המיקום: <code>G0/0 in</code> — הכי קרוב למקור הסכנה.")}<br><br><button id="n2">${L("إلى الجزء ج ←", "לחלק ג ←")}</button></div>`);
    $("#sub1").disabled = true; $("#n2").onclick = () => finalTask2(main, res); $("#n2").scrollIntoView({ behavior: "smooth" });
  };
}

function finalTask2(main, res) {
  const terms = shuffle(MATCH_PAIRS.map((p, k) => ({ ...p, k }))), defs = shuffle(MATCH_PAIRS.map((p, k) => ({ ...p, k })));
  let sel = null, okCount = 0; const missed = new Set(), done = new Set();
  main.innerHTML = `<h2>${L("الجزء ج: طابق المصطلح مع معناه (20)", "חלק ג: התאימו מושג להגדרה (20)")}</h2>
    <div class="card"><p class="muted">${L("اضغط على مصطلح، ثم على المعنى المناسب.", "לחצו על מושג, ואז על ההגדרה המתאימה.")}</p>
    <div class="matchgrid"><div id="mt" style="display:grid;gap:10px"></div><div id="md" style="display:grid;gap:10px"></div></div><div id="m2"></div></div>`;
  const draw = () => {
    $("#mt").innerHTML = terms.map(t => `<div class="mterm ${done.has(t.k) ? "ok" : ""} ${sel === t.k ? "sel" : ""}" data-k="${t.k}" style="font-weight:800;font-size:20px">${t.he}</div>`).join("");
    $("#md").innerHTML = defs.map(d => `<div class="mdef ${done.has(d.k) ? "ok" : ""}" data-k="${d.k}">${T(d.def)}</div>`).join("");
    $$(".mterm").forEach(e => e.onclick = () => { if (!done.has(+e.dataset.k)) { sel = +e.dataset.k; draw(); } });
    $$(".mdef").forEach(e => e.onclick = () => {
      const k = +e.dataset.k; if (sel == null || done.has(k)) return;
      if (k === sel) { done.add(k); if (!missed.has(k)) okCount++; sel = null; draw(); if (done.size === MATCH_PAIRS.length) finish(); }
      else { missed.add(sel); e.classList.add("bad"); setTimeout(() => e.classList.remove("bad"), 400); toast(L("❌ حاول مرة أخرى", "❌ נסו שוב")); }
    });
  };
  const finish = () => {
    res.t2 = Math.round(okCount / MATCH_PAIRS.length * 20);
    $("#m2").innerHTML = `<div class="feedback good" style="margin-top:12px">${okCount}/${MATCH_PAIRS.length} → <b>${res.t2}/20</b><br><br><button id="fin">🏁 ${L("النتيجة النهائية", "התוצאה הסופית")}</button></div>`;
    $("#fin").onclick = () => finalResult(main, res);
  };
  draw();
}

function finalResult(main, res) {
  const s = me(); const score = res.mcq + res.t1 + res.t2, passed = score >= PASS_FINAL;
  const prev = s.final || {};
  s.final = { score, best: Math.max(score, prev.best || 0), passed: passed || !!prev.passed, date: passed ? Date.now() : (prev.date || Date.now()), parts: res, attempts: (prev.attempts || 0) + 1, rewarded: prev.rewarded };
  if (passed && !s.final.rewarded) { s.final.rewarded = true; s.points += 100; }
  save(); renderTop(); if (passed) confetti();
  main.innerHTML = `<div class="card result"><div style="font-size:80px">${passed ? "🏆" : "💪"}</div><div class="score" style="color:${passed ? "var(--green)" : "var(--orange)"}">${score}</div>
    <table class="t" style="max-width:420px;margin:10px auto"><tr><td>${L("أ — أسئلة", "א — שאלות")}</td><td>${res.mcq}/60</td></tr><tr><td>${L("ب — ACL", "ב — ACL")}</td><td>${res.t1}/20</td></tr><tr><td>${L("ج — مصطلحات", "ג — מושגים")}</td><td>${res.t2}/20</td></tr></table>
    <p style="font-size:20px">${passed ? L(`مبروك يا ${esc(DB.current)}! نجحت 🎉`, `כל הכבוד ${esc(DB.current)}! עברת 🎉`) : L(`تحتاج ${PASS_FINAL} للنجاح. كل محاولة فيها أسئلة جديدة — حاول مرة أخرى!`, `צריך ${PASS_FINAL} כדי לעבור. בכל ניסיון שאלות חדשות — נסו שוב!`)}</p>
    <div class="row" style="justify-content:center">${passed ? `<button class="green" id="cert">🎓 ${L("شهادتي", "התעודה שלי")}</button>` : ""}<button id="again">↻ ${L("محاولة جديدة", "ניסיון חדש")}</button><button class="ghost" onclick="go('home')">${L("الخريطة", "למפה")}</button></div></div>`;
  $("#again").onclick = () => startFinal(main);
  $("#cert") && ($("#cert").onclick = () => showCert(main));
}

function showCert(main) {
  const s = me();
  main.innerHTML = `<div class="cert"><div style="font-size:60px">🛡️</div><h1>${L("شهادة إنجاز", "תעודת הצטיינות")}</h1><div style="font-size:22px">${L("أمن المعلومات — אבטחת מידע", "אבטחת מידע — أمن المعلومات")}</div>
    <p style="font-size:20px">${L("نشهد أن الطالب/ة", "מוענקת ל")}</p><div class="nm">${esc(DB.current)}</div>
    <p style="font-size:20px">${L("أنهى/ت بنجاح جميع مراحل لومدة أمن المعلومات<br>وحصل/ت في الاختبار النهائي على", "על סיום כל שלבי לומדת אבטחת המידע<br>וציון במבחן המסכם:")} <b>${s.final.best}</b></p>
    <div style="font-size:34px">${STAGES.map(st => st.badge.icon).join(" ")} 🏆</div>
    <p>⭐ ${s.points} · ${new Date(s.final.date).toLocaleDateString(DB.lang === "he" ? "he-IL" : "ar")}</p></div>
    <div class="row noprint" style="justify-content:center;margin-top:16px"><button onclick="try{print()}catch(e){}">🖨️ ${L("طباعة / PDF", "הדפסה / PDF")}</button><button class="ghost" onclick="go('home')">${L("الخريطة", "למפה")}</button></div>`;
}

</script>
